<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStage2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2C23" />
      <stop offset="60%" stop-color="#2E5E43" />
      <stop offset="100%" stop-color="#27AE60" />
    </linearGradient>

    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12" />
      <stop offset="100%" stop-color="#E0A838" />
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#E0A838" flood-opacity="0.6"/>
    </filter>

    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky & Landscape Background -->
  <rect width="800" height="500" fill="url(#bgStage2)" />

  <!-- Solar Glowing Sun & Beams -->
  <circle cx="650" cy="110" r="70" fill="url(#sunGrad)" filter="url(#glow2)"/>
  <circle cx="650" cy="110" r="110" fill="#E0A838" opacity="0.15" />

  <!-- Solar Powered Pheromone Trap Machine Graphic (Center Right) -->
  <g transform="translate(600, 180)">
    <!-- Solar Panel Frame -->
    <rect x="-40" y="-70" width="80" height="24" rx="4" fill="#37474F" stroke="#E0A838" stroke-width="2"/>
    <line x1="-20" y1="-70" x2="-20" y2="-46" stroke="#90A4AE" stroke-width="1.5"/>
    <line x1="0" y1="-70" x2="0" y2="-46" stroke="#90A4AE" stroke-width="1.5"/>
    <line x1="20" y1="-70" x2="20" y2="-46" stroke="#90A4AE" stroke-width="1.5"/>

    <!-- Support Pole -->
    <rect x="-6" y="-46" width="12" height="180" fill="#78909C" />

    <!-- Trap Canopy & Light -->
    <path d="M-50 -10 L50 -10 L30 -35 L-30 -35 Z" fill="#E0A838" />
    <circle cx="0" cy="15" r="22" fill="#FFF59D" filter="url(#glow2)" opacity="0.9"/>
    <text x="0" y="22" font-size="20" text-anchor="middle">💡</text>

    <!-- Trap Funnel & Catch Basin -->
    <path d="M-35 30 L35 30 L20 80 L-20 80 Z" fill="#27AE60" opacity="0.9"/>
  </g>

  <!-- GREEN CROPS & LADYBIRD BEETLES GRAPHICS -->
  <g transform="translate(180, 260)">
    <!-- Healthy Spice Crops -->
    <path d="M-60 120 Q -40 20, 0 -60 Q 40 20, 60 120 Z" fill="#81C784" />
    <path d="M0 120 Q -10 0, -30 -80 Q 0 -20, 0 120 Z" fill="#27AE60" />
    <path d="M0 120 Q 10 0, 30 -70 Q 0 -20, 0 120 Z" fill="#4CAF50" />

    <!-- Large Ladybird Beetle Graphic 1 -->
    <g transform="translate(-40, -20) scale(1.4)">
      <circle cx="0" cy="0" r="22" fill="#E53935" stroke="#1C2C23" stroke-width="2.5" filter="url(#shadow2)"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#1C2C23" stroke-width="2.5"/>
      <circle cx="-10" cy="-8" r="4.5" fill="#1C2C23"/>
      <circle cx="10" cy="-8" r="4.5" fill="#1C2C23"/>
      <circle cx="-12" cy="8" r="4.5" fill="#1C2C23"/>
      <circle cx="12" cy="8" r="4.5" fill="#1C2C23"/>
      <circle cx="0" cy="-20" r="10" fill="#1C2C23"/>
    </g>

    <!-- Ladybird Beetle Graphic 2 -->
    <g transform="translate(70, -40) scale(1.2)">
      <circle cx="0" cy="0" r="20" fill="#E53935" stroke="#1C2C23" stroke-width="2" filter="url(#shadow2)"/>
      <line x1="0" y1="-20" x2="0" y2="20" stroke="#1C2C23" stroke-width="2"/>
      <circle cx="-8" cy="-6" r="4" fill="#1C2C23"/>
      <circle cx="8" cy="-6" r="4" fill="#1C2C23"/>
      <circle cx="-9" cy="7" r="4" fill="#1C2C23"/>
      <circle cx="9" cy="7" r="4" fill="#1C2C23"/>
      <circle cx="0" cy="-18" r="8" fill="#1C2C23"/>
    </g>

    <!-- Parasitic Wasp / Bee Graphic -->
    <g transform="translate(180, -100) scale(1.3)">
      <text x="0" y="0" font-size="36" filter="url(#shadow2)">🐝</text>
    </g>
  </g>

  <!-- FLOATING BADGES -->
  <!-- Badge 1: Predators -->
  <g transform="translate(50, 40)">
    <rect width="250" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#E53935" />
    <text x="30" y="32" font-size="16" text-anchor="middle">🐞</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">BIOLOGICAL DEFENDERS</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#81C784">Ladybird Beetles &amp; Wasps</text>
  </g>

  <!-- Badge 2: Solar Traps -->
  <g transform="translate(500, 40)">
    <rect width="250" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#E0A838" />
    <text x="30" y="32" font-size="16" text-anchor="middle">☀️</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">SOLAR PHEROMONE TRAPS</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#F39C12">Zero Synthetic Chemical Sprays</text>
  </g>

  <!-- CENTER LOCATION BANNER -->
  <g transform="translate(240, 430)">
    <rect width="320" height="44" rx="22" fill="#1C2C23" fill-opacity="0.9" stroke="#E0A838" stroke-width="2" filter="url(#shadow2)"/>
    <text x="160" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#E0A838" text-anchor="middle" letter-spacing="1">
      🐞 STAGE 02 • NATURAL CROP DEFENSE
    </text>
  </g>
</svg>
