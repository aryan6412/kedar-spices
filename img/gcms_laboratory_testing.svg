<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStage4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1C13" />
      <stop offset="60%" stop-color="#1C2C23" />
      <stop offset="100%" stop-color="#0D1C13" />
    </linearGradient>

    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00E676" flood-opacity="0.7"/>
    </filter>

    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bgStage4)" />

  <!-- DIGITAL LABORATORY TEST CERTIFICATE & GC-MS SPECTROMETER (CENTER) -->
  <g transform="translate(400, 240)">
    
    <!-- Outer Digital Screen Frame -->
    <rect x="-240" y="-160" width="480" height="300" rx="24" fill="#1C2C23" stroke="#27AE60" stroke-width="3" filter="url(#shadow4)"/>
    <rect x="-220" y="-140" width="440" height="260" rx="16" fill="#0D1C13" />

    <!-- Screen Header Bar -->
    <rect x="-220" y="-140" width="440" height="42" fill="#27AE60" fill-opacity="0.15" />
    <text x="-200" y="-113" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#00E676" letter-spacing="1">
      🔬 ACCREDITED LAB GC-MS/MS &amp; LC-MS/MS SCREENING
    </text>
    <rect x="130" y="-127" width="70" height="24" rx="12" fill="#00E676" />
    <text x="165" y="-111" font-family="'Outfit', sans-serif" font-size="11" font-weight="900" fill="#0D1C13" text-anchor="middle">PASSED</text>

    <!-- GC-MS Spectrometer Chromatogram Wave Graphic -->
    <path d="M-200 20 Q-150 20, -130 -80 Q-110 50, -80 -20 Q-50 20, -20 -120 Q0 30, 30 20 Q60 -40, 80 20 Q120 20, 200 20" 
          stroke="#00E676" stroke-width="3.5" fill="none" filter="url(#glow4)"/>

    <!-- Baseline Grid Lines -->
    <line x1="-200" y1="20" x2="200" y2="20" stroke="#27AE60" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="-200" y1="-40" x2="200" y2="-40" stroke="#27AE60" stroke-opacity="0.15" stroke-dasharray="4,4" />
    <line x1="-200" y1="-100" x2="200" y2="-100" stroke="#27AE60" stroke-opacity="0.15" stroke-dasharray="4,4" />

    <!-- Test Result Metrics -->
    <g transform="translate(-180, 60)">
      <rect x="0" y="0" width="170" height="45" rx="10" fill="#1C2C23" stroke="#27AE60" stroke-opacity="0.3" />
      <text x="12" y="18" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#81C784">PESTICIDE RESIDUE</text>
      <text x="12" y="36" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#00E676">0.00 mg/kg (ND)</text>
    </g>

    <g transform="translate(10, 60)">
      <rect x="0" y="0" width="170" height="45" rx="10" fill="#1C2C23" stroke="#E0A838" stroke-opacity="0.3" />
      <text x="12" y="18" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#E0A838">EXPORT CERTIFICATION</text>
      <text x="12" y="36" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">EU &amp; US FDA PASSED</text>
    </g>

  </g>

  <!-- FLOATING BADGES -->
  <!-- Badge 1: 500+ Screened -->
  <g transform="translate(50, 40)">
    <rect width="250" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#00E676" />
    <text x="30" y="32" font-size="16" text-anchor="middle">🧪</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">500+ COMPOUNDS TESTED</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#00E676">GC-MS/MS &amp; LC-MS/MS Screening</text>
  </g>

  <!-- Badge 2: 0.00% Zero Residue -->
  <g transform="translate(500, 40)">
    <rect width="250" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#E0A838" />
    <text x="30" y="32" font-size="16" text-anchor="middle">📜</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">EU MRL &amp; FDA CERTIFIED</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#F39C12">0.00% Chemical Residue</text>
  </g>

  <!-- CENTER LOCATION BANNER -->
  <g transform="translate(240, 430)">
    <rect width="320" height="44" rx="22" fill="#1C2C23" fill-opacity="0.9" stroke="#E0A838" stroke-width="2" filter="url(#shadow4)"/>
    <text x="160" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#E0A838" text-anchor="middle" letter-spacing="1">
      📜 STAGE 04 • LABORATORY GC-MS TESTING
    </text>
  </g>
</svg>
