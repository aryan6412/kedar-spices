<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Sky & Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C2C23" />
      <stop offset="60%" stop-color="#2E5E43" />
      <stop offset="100%" stop-color="#27AE60" />
    </linearGradient>

    <!-- Fertile Soil Gradient -->
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A3525" />
      <stop offset="40%" stop-color="#362517" />
      <stop offset="100%" stop-color="#21150C" />
    </linearGradient>

    <!-- Bio-Shield Glow Filter -->
    <filter id="bioGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#81C784" flood-opacity="0.6"/>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky & Landscape Background -->
  <rect width="800" height="320" fill="url(#skyGrad)" />

  <!-- Sun Rays & Warm Aura -->
  <circle cx="400" cy="180" r="140" fill="#E0A838" opacity="0.15" />
  <circle cx="400" cy="180" r="80" fill="#F39C12" opacity="0.2" />

  <!-- Distant Unjha Farm Hills -->
  <path d="M0 260 Q 180 210, 360 250 T 720 230 T 800 250 L 800 320 L 0 320 Z" fill="#234733" opacity="0.8" />
  <path d="M0 280 Q 220 240, 440 270 T 800 260 L 800 320 L 0 320 Z" fill="#1C2C23" opacity="0.9" />

  <!-- Rich Organic Soil Bed (Bottom Half) -->
  <rect y="300" width="800" height="200" fill="url(#soilGrad)" />

  <!-- Soil Top Organic Layer Line -->
  <path d="M0 300 Q 200 295, 400 302 T 800 298" stroke="#81C784" stroke-width="4" fill="none" opacity="0.7"/>

  <!-- BIO-PRIMING INGREDIENTS & ROOT PROTECTION GRAPHICS -->

  <!-- Left Seedling (Bio-Primed with Neem & Trichoderma) -->
  <g transform="translate(220, 240)">
    <!-- Root System with Green Bio Shield -->
    <path d="M0 60 C-10 90, -25 110, -40 130 M0 60 C5 90, 15 115, 20 135 M0 60 C-5 85, 0 105, 0 140" 
          stroke="#D7CCC8" stroke-width="3" fill="none" />
    
    <!-- Trichoderma Bio-Shield Aura around roots -->
    <circle cx="-10" cy="100" r="45" fill="#81C784" opacity="0.25" filter="url(#bioGlow)" />
    <circle cx="-10" cy="100" r="30" fill="#27AE60" opacity="0.2" />

    <!-- Healthy Green Sprout -->
    <path d="M0 60 Q -5 20, -20 0 Q -5 5, 0 60 Z" fill="#81C784" />
    <path d="M0 60 Q 5 15, 25 -5 Q 8 5, 0 60 Z" fill="#27AE60" />
    <path d="M0 60 Q 0 10, 0 -20 Q -2 0, 0 60 Z" fill="#4CAF50" />
  </g>

  <!-- Center Primary Seedling (Unjha Cumin / Spice Germination) -->
  <g transform="translate(400, 200)">
    <!-- Root System -->
    <path d="M0 100 C-20 130, -40 160, -60 180 M0 100 C15 135, 30 160, 45 180 M0 100 C-5 125, 5 155, 0 190 M-10 100 C-30 120, -50 140, -70 150 M10 100 C30 120, 50 140, 70 150" 
          stroke="#E0E0E0" stroke-width="3.5" fill="none" />

    <!-- Trichoderma Bio-Shield Protective Sphere -->
    <circle cx="0" cy="140" r="65" fill="#27AE60" opacity="0.2" filter="url(#bioGlow)" />
    <circle cx="0" cy="140" r="50" fill="#81C784" opacity="0.25" />

    <!-- Vigorous Tall Sprout -->
    <path d="M0 100 Q -10 40, -35 0 Q -10 10, 0 100 Z" fill="#81C784" />
    <path d="M0 100 Q 10 30, 40 -10 Q 12 10, 0 100 Z" fill="#27AE60" />
    <path d="M0 100 Q -5 -10, -15 -45 Q -2 -20, 0 100 Z" fill="#A5D6A7" />
    <path d="M0 100 Q 5 -10, 15 -50 Q 2 -20, 0 100 Z" fill="#4CAF50" />
  </g>

  <!-- Right Seedling (Bio-Primed) -->
  <g transform="translate(580, 240)">
    <!-- Root System -->
    <path d="M0 60 C-15 90, -20 115, -30 135 M0 60 C10 90, 25 110, 35 130 M0 60 C0 85, -5 110, -5 140" 
          stroke="#D7CCC8" stroke-width="3" fill="none" />

    <!-- Bio Shield -->
    <circle cx="0" cy="100" r="45" fill="#81C784" opacity="0.25" filter="url(#bioGlow)" />

    <!-- Sprout -->
    <path d="M0 60 Q -10 20, -25 -5 Q -8 5, 0 60 Z" fill="#27AE60" />
    <path d="M0 60 Q 8 15, 20 0 Q 5 5, 0 60 Z" fill="#81C784" />
  </g>

  <!-- ORGANIC INPUT BADGES (FLOATING GLASS CARDS) -->

  <!-- Neem Cake & Trichoderma Badge (Top Left) -->
  <g transform="translate(50, 40)">
    <rect width="240" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#27AE60" />
    <text x="30" y="32" font-size="16" text-anchor="middle">🌿</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">NEEM CAKE &amp; TRICHODERMA</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#81C784">Natural Soil Pathogen Shield</text>
  </g>

  <!-- Germination Success Badge (Top Right) -->
  <g transform="translate(510, 40)">
    <rect width="240" height="52" rx="16" fill="#FFFFFF" fill-opacity="0.15" stroke="#FFFFFF" stroke-width="1.5" style="backdrop-filter: blur(10px);" />
    <circle cx="30" cy="26" r="16" fill="#E0A838" />
    <text x="30" y="32" font-size="16" text-anchor="middle">✨</text>
    <text x="56" y="24" font-family="'Outfit', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF">99.8% HEALTHY SPROUTS</text>
    <text x="56" y="38" font-family="'Outfit', sans-serif" font-size="10" font-weight="500" fill="#F39C12">Zero Synthetic Chemicals</text>
  </g>

  <!-- CENTER LOCATION BADGE BANNER -->
  <g transform="translate(250, 430)">
    <rect width="300" height="44" rx="22" fill="#1C2C23" fill-opacity="0.9" stroke="#27AE60" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="150" y="27" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#81C784" text-anchor="middle" letter-spacing="1">
      📍 UNJHA FARMS, GUJARAT • SOIL STAGE
    </text>
  </g>

</svg>
